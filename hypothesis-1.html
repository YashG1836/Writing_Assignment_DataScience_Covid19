<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hypothesis 1 | COVID-19 Inequality Investigation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b1220; --card:#0d1628; --muted:#9fb3c8; --accent:#5ce1e6; --accent-2:#7c5dff; --text:#e8f0ff; --border:rgba(255,255,255,0.08); --glow:rgba(92,225,230,0.18); }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Space Grotesk','Segoe UI',sans-serif;background:radial-gradient(circle at 20% 20%,rgba(92,225,230,.10),transparent 32%),radial-gradient(circle at 78% 16%,rgba(124,93,255,.12),transparent 34%),linear-gradient(180deg,rgba(13,22,40,0.85),rgba(11,18,32,0.92)),var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
    .header-spacer{height:90px}
    .watermark{position:fixed;right:14px;bottom:12px;opacity:.18;font-weight:700;letter-spacing:.2em;color:var(--text);pointer-events:none;font-size:14px;text-transform:uppercase}
    header{padding:28px 20px 16px;position:fixed;top:0;left:0;right:0;z-index:12;background:rgba(11,18,32,0.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);transition:padding .18s ease,background .2s ease,box-shadow .2s ease,transform .2s ease}
    header.show{transform:translateY(0);box-shadow:0 12px 24px rgba(0,0,0,.22)}
    header.hidden{transform:translateY(-100%);box-shadow:none}
    .hero{max-width:1180px;margin:0 auto;display:grid;gap:12px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(34,211,238,.1);color:var(--accent);border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.01em}
    h1{margin:0;font-size:clamp(30px,4vw,44px);line-height:1.1;font-weight:700}
    .lede{margin:2px 0 0;color:var(--muted);max-width:900px;font-size:17px;line-height:1.6}
    nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;max-height:0;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(-6px);transition:max-height .18s ease,opacity .18s ease,transform .18s ease}
    .nav-chip{border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);padding:11px 14px;border-radius:12px;text-align:center;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;transition:transform 120ms ease,box-shadow 160ms ease,border-color 160ms ease;background-image:linear-gradient(135deg,rgba(92,225,230,0.14),rgba(124,93,255,0.10));}
    .nav-chip:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,0.32),0 0 0 1px var(--border),0 8px 26px var(--glow);border-color:rgba(92,225,230,0.4)}
    main{max-width:1180px;margin:0 auto 80px;padding:0 20px 24px}
    header.show nav,header:hover nav{max-height:480px;opacity:1;pointer-events:auto;transform:translateY(0)}
    section.card{background:linear-gradient(150deg,rgba(18,27,46,0.95),rgba(12,18,33,0.92));border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 22px 48px rgba(0,0,0,0.38),0 0 0 1px rgba(255,255,255,0.02)}
    .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px}
    .section-head h2{margin:0;font-size:21px;letter-spacing:-.01em}
    .pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted);font-size:13px;border:1px solid var(--border)}
    article{line-height:1.6;color:var(--text);overflow-x:auto}
    article p{color:var(--muted)}
    pre{background:#0c1529;border:1px solid var(--border);border-radius:12px;padding:14px;overflow-x:auto;color:#e5e7eb;font-size:13px;line-height:1.5}
    code{font-family:'SFMono-Regular',Consolas,Menlo,monospace}
    details.code-toggle{border:1px solid var(--border);background:rgba(255,255,255,.04);border-radius:12px;margin:12px 0;padding:0 12px}
    details.code-toggle summary{cursor:pointer;font-weight:600;color:var(--accent);padding:10px 0;outline:none;list-style:none}
    details.code-toggle[open]{box-shadow:0 12px 24px rgba(0,0,0,0.28)}
    details.code-toggle summary::-webkit-details-marker{display:none}
    article img{width:100%;max-width:820px;display:block;margin:12px auto;border-radius:14px;border:1px solid var(--border)}
    table{width:100%;border-collapse:collapse;border:1px solid var(--border);margin:12px 0;font-size:13px;display:block;overflow-x:auto}
    th,td{padding:8px;border:1px solid var(--border);color:var(--muted)}
    th{background:rgba(255,255,255,.04);color:var(--text)}
    .status{margin-top:6px;color:var(--muted);font-size:14px}
    .alert{background:rgba(245,158,11,.12);color:#f8d99d;border:1px solid rgba(245,158,11,.28);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:8px}
    @media(max-width:720px){nav{gap:6px}.section-head{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const loadScriptFallback=(urls)=>new Promise((resolve,reject)=>{let i=0;const next=()=>{if(i>=urls.length)return reject(new Error('scripts failed'));const s=document.createElement('script');s.src=urls[i++];s.onload=()=>resolve();s.onerror=next;document.head.appendChild(s);};next();});
    const sliceMarkdown=(raw,startToken,endToken)=>{if(!raw)return'';const si=startToken?raw.indexOf(startToken):0;const ss=si>=0?si:0;const ei=endToken?raw.indexOf(endToken,ss):-1;const se=ei>=0?ei:raw.length;return raw.slice(ss,se).trim();};
    const wrapCodeBlocks=(article)=>{article.querySelectorAll('pre').forEach((pre)=>{const details=document.createElement('details');details.className='code-toggle';const summary=document.createElement('summary');summary.textContent='Show code';details.appendChild(summary);details.appendChild(pre.cloneNode(true));details.addEventListener('toggle',()=>{summary.textContent=details.open?'Hide code':'Show code';});pre.replaceWith(details);});};
    const renderSection=({title,subtitle,markdown},parser)=>{const section=document.createElement('section');section.className='card';const head=document.createElement('div');head.className='section-head';const h2=document.createElement('h2');h2.textContent=title;head.appendChild(h2);if(subtitle){const pill=document.createElement('span');pill.className='pill';pill.textContent=subtitle;head.appendChild(pill);}section.appendChild(head);const article=document.createElement('article');if(parser){article.innerHTML=parser(markdown||'');}else{const pre=document.createElement('pre');pre.textContent=markdown||'';article.appendChild(pre);}wrapCodeBlocks(article);section.appendChild(article);return section;};
    const pageConfig={title:'Hypothesis 1',subtitle:'India vs global COVID-19 outcomes and framing.',bodyTitle:'Hypothesis 1',bodySubtitle:'India vs global comparison',start:'### Hypothesis 1 (India vs Global Comparison)',end:'### Hypothesis 2 (State vs State Comparison within India)'};
    const build=async()=>{
      const root=document.getElementById('root');root.innerHTML='';
      const header=document.createElement('header');const hero=document.createElement('div');hero.className='hero';hero.innerHTML=`
        <span class="eyebrow">COVID-19 | Inequality & Impact</span>
        <h1>${pageConfig.title}</h1>
        <p class="lede">${pageConfig.subtitle}</p>
        <nav>
          <a class="nav-chip" href="index.html">Home</a>
          <a class="nav-chip" href="introduction.html">Introduction</a>
          <a class="nav-chip" href="data-summary.html">Data Summary</a>
          <a class="nav-chip" href="hypothesis-1.html">Hypothesis 1</a>
          <a class="nav-chip" href="hypothesis-2.html">Hypothesis 2</a>
        </nav>
        <div class="status" id="load-status">Loading…</div>
      `;header.appendChild(hero);root.appendChild(header);
      const spacer=document.createElement('div');spacer.className='header-spacer';root.appendChild(spacer);
      const watermark=document.createElement('div');watermark.className='watermark';watermark.textContent='YG';root.appendChild(watermark);
      const main=document.createElement('main');root.appendChild(main);
      const headerEl=header;let lastY=0,upAccum=0,downAccum=0;const syncNav=()=>{const y=window.scrollY;const delta=y-lastY;if(y<40){headerEl.classList.add('show');headerEl.classList.remove('hidden');upAccum=0;downAccum=0;}else{if(delta>0){downAccum+=delta;upAccum=0;}else if(delta<0){upAccum-=delta;downAccum=0;}if(downAccum>14){headerEl.classList.add('hidden');headerEl.classList.remove('show');}if(upAccum>26){headerEl.classList.add('show');headerEl.classList.remove('hidden');}}lastY=y;spacer.style.height=`${headerEl.offsetHeight}px`;};window.addEventListener('scroll',syncNav,{passive:true});window.addEventListener('resize',()=>spacer.style.height=`${headerEl.offsetHeight}px`);syncNav();
      let parseFn=null;try{await loadScriptFallback(['https://unpkg.com/marked/marked.min.js','https://cdn.jsdelivr.net/npm/marked/marked.min.js']);if(window.marked){window.marked.setOptions({breaks:true,gfm:true,headerIds:true,mangle:false});parseFn=(md)=>window.marked.parse(md);}}catch(e){const status=document.getElementById('load-status');if(status)status.textContent='Parser failed to load; showing plain text.';}
      fetch('Reseach.md',{cache:'no-cache'}).then(res=>{if(!res.ok)throw new Error('Could not load markdown');return res.text();}).then(raw=>{const status=document.getElementById('load-status');if(status)status.remove();const mdSlice=sliceMarkdown(raw,pageConfig.start,pageConfig.end);const section=renderSection({title:pageConfig.bodyTitle,subtitle:pageConfig.bodySubtitle,markdown:mdSlice},parseFn);main.appendChild(section);}).catch(err=>{const status=document.getElementById('load-status');if(status)status.textContent='Unable to load Reseach.md';const alert=document.createElement('div');alert.className='alert';alert.textContent='Start a server in this folder (e.g., python -m http.server 8000) and ensure Reseach.md is present.';const detail=document.createElement('div');detail.className='status';detail.textContent=`Error: ${err.message}`;hero.appendChild(alert);hero.appendChild(detail);});
    };
    window.addEventListener('DOMContentLoaded',build);
  </script>
</body>
</html>
